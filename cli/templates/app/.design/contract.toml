schema = 1
name = "skies-app"
token_files = ["tokens.tokens.json"]

[policies]
max_primary_actions_per_region = 1
max_heading_jump = 1
require_icon_intent = true
button_label_pattern = "^[A-ZÀ-Þ][^.!?]*$"

[[components]]
name = "screen"
tier = "template"
parts = ["stack"]

[[components]]
name = "stack"
tier = "molecule"
parts = ["text", "card"]

[[components]]
name = "text"
tier = "atom"
roles = ["display", "title", "heading", "body", "label", "caption"]

[[components]]
name = "button"
tier = "atom"
variants = ["primary", "secondary", "danger"]
states = ["default", "disabled", "loading"]
roles = ["button"]
required_slots = ["label"]

[[components]]
name = "field"
tier = "molecule"
parts = ["input"]

[[components]]
name = "input"
tier = "atom"
states = ["default", "invalid"]
roles = ["textbox"]

[[components]]
name = "card"
tier = "molecule"
parts = ["field", "button"]

[[surfaces]]
name = "sample-ui-kit"
template = "screen"
required_components = ["screen", "stack", "text", "button", "field", "input", "card"]
states = ["default", "invalid", "loading"]
themes = ["light", "dark"]
viewports = ["compact", "regular", "wide"]
locales = ["en", "pt-BR"]
