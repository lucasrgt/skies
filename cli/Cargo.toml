[package]
name = "skies-cli"
description = "The Skies convention CLI: scaffolders, doctor, and spec proofs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "skies"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
