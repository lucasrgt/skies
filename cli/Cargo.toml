[package]
name = "skies-cli"
description = "The Skies convention CLI: scaffolders, doctor, and spec proofs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "skies"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
minijinja = "2"
rayon = "1"
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-dart = "0.2"
walkdir = "2"
