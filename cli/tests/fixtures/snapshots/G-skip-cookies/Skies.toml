# Skies workspace manifest: this app's topology and the runners that execute spec E2E. One Skies.toml per
# repo, at the root.

[workspace]
name = "Golden"

[products.app]
backend = "src/Golden.Api"   # .NET vertical slices; the SKY* analyzers run in its build
tests = "tests/Golden.Tests" # compiles every spec's e2e/; `skies doctor` builds it (and the backend)
# frontend = "clients/web"                     # a React or Flutter package, declared when you add one

# Every test lives in a spec: .specs/<id>-<slug>/e2e/ holds its cases, titled "FM-n: ...". There is no other
# place for a test, unit or not (SKY0029, SKYFE036, SKYFL036); an isolated system gets its own spec.
# A runner executes one spec's e2e/ folder and writes a JUnit or TRX report that `skies proof` reads back.
# Placeholders: {id} (0001), {dir} (.specs/0001-auth/e2e), {spec} (0001-auth), {report} (the report path),
# {coverage} (where coverage goes). With coverage, a receipt's footprint is every file the green run executed, so a
# change to shared code it relies on makes it stale; coverlet writes Cobertura under {coverage}/<guid>/.
# Specs name their runner in spec.md (`runner: api`). `scope` limits a receipt to the files under its paths (the diff,
# `touches`, coverage), so a web runner added later keeps its own surface.
[runners.api]
scope = ["src/"]
command = "dotnet test tests/Golden.Tests --filter FullyQualifiedName~Specs.S{id}. --logger 'trx;LogFileName={report}' --collect 'XPlat Code Coverage' --results-directory {coverage} -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura"
