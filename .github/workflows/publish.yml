name: publish

# Publishes every Skies package from one version tag (e.g. `v5.0.0`): NuGet, npm (the React packages and the
# `skies` binary wrappers), pub.dev, crates.io, and the binaries as GitHub release assets. All packages share one
# version; the `versions` job fails the release if any manifest or template pin disagrees with the tag
# (tools/check-versions.sh).
#
# Nothing is published until everything could be: `preflight` fails the release when a registry credential is
# missing and dry-runs every package (npm, crates.io, pub.dev, the NuGet packs), and the binaries build for every
# target. Then the registries publish one after another (NuGet, npm React, pub.dev, crates.io, the npm binary
# wrappers) and the GitHub release comes last, so a failure stops the chain instead of leaving it half done in
# parallel. Every step skips a version its registry already has, so recovering from a failure mid-chain is: fix the
# cause, then re-run the failed jobs of this workflow run (or push the same tag again).
#
# Auth: NuGet prefers Trusted Publishing and falls back to NUGET_API_KEY; npm uses NPM_TOKEN; crates.io uses
# CARGO_REGISTRY_TOKEN; pub.dev uses automated publishing (GitHub OIDC, enabled on the package's admin page).
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  versions:
    name: every package carries the tag's version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compare every version pin with the tag
        run: tools/check-versions.sh "${GITHUB_REF_NAME#v}"

  preflight:
    name: every registry is reachable and every package would publish
    needs: [ci, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: nuget login (OIDC → temp key)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: lucasrgt
      - name: the credentials every publish step needs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          missing=
          [ -n "$NPM_TOKEN" ] || missing="$missing NPM_TOKEN"
          [ -n "$CARGO_REGISTRY_TOKEN" ] || missing="$missing CARGO_REGISTRY_TOKEN"
          [ -n "$NUGET_API_KEY" ] || missing="$missing NuGet(Trusted Publishing or NUGET_API_KEY)"
          if [ -n "$missing" ]; then echo "missing:$missing — nothing was published"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
      - name: crates.io dry run
        run: cargo publish -p skies-cli --locked --dry-run
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm dry run (React packages and the binary wrapper)
        run: |
          (cd frontend-sdk && npm ci --no-audit --no-fund && npm publish --workspaces --dry-run --access public --tag next)
          npm publish ./cli/npm --dry-run --access public --tag next
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: NuGet packs
        run: for proj in src/*/*.csproj analyzers/Skies.Framework.Doctor/Skies.Framework.Doctor.csproj; do dotnet pack "$proj" -c Release -o nupkgs; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub.dev dry run
        working-directory: flutter-sdk/packages/skies_flutter
        run: flutter pub publish --dry-run

  binaries:
    name: build skies (${{ matrix.target }})
    needs: [ci, versions]
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, npm: linux-x64, exe: skies }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, npm: linux-arm64, exe: skies }
          - { target: x86_64-apple-darwin, os: macos-15-intel, npm: darwin-x64, exe: skies }
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64, exe: skies }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, npm: win32-x64, exe: skies.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: skies-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}

  github-release:
    name: attach binaries to the GitHub release
    needs: npm-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: archive and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # upload-artifact stores files without their mode, so the executable bit is restored before archiving.
          chmod +x skies-*/*
          for dir in skies-*; do tar -czf "$dir.tar.gz" -C "$dir" .; done
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $pre *.tar.gz || \
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz

  npm-cli:
    name: publish the skies binary to npm
    needs: [crates, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: publish platform packages, then the wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() { name=$(node -p "require('./$1/package.json').name"); ver=$(node -p "require('./$1/package.json').version")
            # npm refuses a prerelease on the default dist-tag; release candidates go to `next`.
            tag=latest; case "$ver" in *-*) tag=next ;; esac
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "$name@$ver already published"; else npm publish "./$1" --access public --provenance --tag "$tag"; fi; }
          for dir in dist/skies-*; do
            platform=${dir#dist/skies-}
            exe=$(ls "$dir")
            node cli/npm/pack-platform.mjs "${platform%-*}" "${platform##*-}" "$dir/$exe" "out/$platform"
            publish "out/$platform"   # a bare "out/x" would read as a GitHub repository, hence ./ inside publish
          done
          publish cli/npm

  crates:
    name: publish skies-cli to crates.io
    needs: pub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl --fail --silent -A "skies-release (github.com/lucasrgt/skies)" \
            "https://crates.io/api/v1/crates/skies-cli/$version" >/dev/null; then
            echo "skies-cli@$version already on crates.io"; exit 0
          fi
          cargo publish -p skies-cli --locked

  nuget:
    name: pack + push to nuget.org
    needs: [preflight, binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: pack
        run: |
          for proj in \
            src/Skies/Skies.Framework.csproj \
            src/Skies.Framework.Abstractions/Skies.Framework.Abstractions.csproj \
            src/Skies.Framework.AspNetCore/Skies.Framework.AspNetCore.csproj \
            src/Skies.Framework.Auth/Skies.Framework.Auth.csproj \
            src/Skies.Framework.EntityFrameworkCore/Skies.Framework.EntityFrameworkCore.csproj \
            src/Skies.Framework.Identity/Skies.Framework.Identity.csproj \
            src/Skies.Framework.Mail/Skies.Framework.Mail.csproj \
            src/Skies.Framework.Sms/Skies.Framework.Sms.csproj \
            src/Skies.Framework.Storage/Skies.Framework.Storage.csproj \
            src/Skies.Framework.Testing/Skies.Framework.Testing.csproj \
            src/Skies.Framework.Testing.InMemory/Skies.Framework.Testing.InMemory.csproj \
            src/Skies.Framework.Testing.Postgres/Skies.Framework.Testing.Postgres.csproj \
            analyzers/Skies.Framework.Doctor/Skies.Framework.Doctor.csproj ; do
            dotnet pack "$proj" -c Release -o nupkgs
          done
      - name: nuget login (OIDC → temp key)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: lucasrgt
      - name: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "Neither NuGet Trusted Publishing nor NUGET_API_KEY is available."; exit 1; fi
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm-react:
    name: publish React packages to npm
    needs: nuget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - working-directory: frontend-sdk
        run: npm ci
      - name: publish (skip versions already on npm)
        working-directory: frontend-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "$name@$ver already on npm"; else (cd "$dir" && tag=latest; case "$ver" in *-*) tag=next ;; esac; npm publish --access public --tag "$tag"); fi
          done

  pub:
    name: publish skies_flutter to pub.dev
    needs: npm-react
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: flutter-sdk/packages/skies_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          if curl --fail --silent "https://pub.dev/api/packages/skies_flutter/versions/$version" >/dev/null; then
            echo "skies_flutter@$version already on pub.dev"; exit 0
          fi
          flutter pub publish --force
