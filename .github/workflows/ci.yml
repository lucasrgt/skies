name: CI

# One job per body: the Rust CLI, the .NET libraries and analyzers, the React packages, and the Flutter spine.
# Each runs its ordinary build and tests; there is no affected selection and no verification gate.
on:
  workflow_call:
  push:
    branches: [main, v5]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    name: skies CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The npm wrapper's tarball carries bin/skies.js, the launcher runs a platform package's binary, and
      # tools/set-version.sh moves every version pin (on a copy of the checkout).
      - name: release plumbing (npm pack, launcher, set-version)
        run: cargo build --locked && tools/release-check.sh target/debug/skies

  dotnet:
    name: .NET libraries, doctor, and sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Skies.Framework.slnx -c Release
      - run: dotnet test Skies.Framework.slnx -c Release --no-build

  auth-smoke:
    name: generated apps on the packed packages (doctor-clean, specs pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: tools/auth-smoke.sh

  web-smoke:
    name: generated React app (build, typecheck, lint, spec, doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: tools/web-smoke.sh

  flutter-smoke:
    name: generated Flutter app (pinned spine, analyze, spec, doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: tools/flutter-smoke.sh

  frontend:
    name: React packages (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - run: npm ci
      - run: npm run check

  flutter:
    name: Flutter spine (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-sdk/packages/skies_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
