title = "The framework bootstrap CLI silently downgraded its own foundation tool lock"
lesson = "The local dotnet tool manifest stayed at CLI 4.1.12 after the source CLI shipped 4.1.15/4.1.16. Running the required skies context command loaded the old tool and rewrote NYA 1.1.7 to 1.1.6. Keep the repository bootstrap tool on an available published version with the required foundation protocol. Updating the local manifest to 4.1.16 makes context pass without changing the current foundation lock."
scope = [
    ".config/dotnet-tools.json",
    "src/Skies.Framework.Cli/Skies.Framework.Cli.csproj",
]
