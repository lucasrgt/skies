title = "A transitive AVP selected a whole subject but omitted its other proof files"
lesson = "When CSharpImpactGraph reaches an AVP file, marking Module/Subject affected obligates every criterion of that subject. Add all subject AVP and journey classes through SelectSlice, as direct proof changes already do. Otherwise the runner can pass every selected test while the matrix reports NOT-RUN for unselected sibling proofs. The regression reproduces that gap and verifies complete subject filters without unrelated subjects or runtime flow contagion."
